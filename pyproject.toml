[project]
name = "sina"
version = "0.1.0"
authors = [
    { name = "Angel Merino", email = "acedeno00@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.2",
    "beautifulsoup4>=4.13.5",
    "dotenv>=0.9.9",
    "fastapi>=0.135.1",
    "google-auth>=2.55.2",
    "image>=1.5.33",
    "ipykernel>=6.30.1",
    "ipython>=9.5.0",
    "itsdangerous>=2.2.0",
    "jupyter>=1.1.1",
    "lxml>=6.0.2",
    "matplotlib>=3.10.6",
    "ollama>=0.5.4",
    "ollama-ocr>=0.1.6",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.2",
    "pgvector>=0.4.2",
    "playwright-stealth==1.0.6",
    "plotly>=6.7.0",
    "podman-compose>=1.5.0",
    "psycopg2>=2.9.11",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.14.2",
    "pymongo>=4.17.0",
    "python-toon>=0.1.3",
    "rarfile>=4.2",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "selenium>=4.35.0",
    "sentence-transformers>=5.5.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.49",
    "torchvision>=0.27.0",
    "uvicorn>=0.41.0",
]

[project.scripts]
sina = "sina:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
